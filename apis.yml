aid: groundswell
name: Groundswell
description: >-
  Groundswell is a corporate social responsibility (CSR) platform that lets
  companies run employee giving, volunteering, grants, employee assistance
  funds, and corporate donor-advised funds from a single integrated system.
  The platform provides instant donation matching and payroll giving, volunteer
  event management and volunteer grants, AI-assisted grant application scoring
  and workflow configuration, confidential employee assistance fund
  applications with rapid funding, tax-efficient corporate DAFs, enterprise
  impact reporting and analytics, and web plus mobile employee experiences.
  Groundswell is backed by Felicis and GV and runs on AWS infrastructure with a
  published trust center and SOC 2 Type I and Type II attestations. It was added
  to the API Evangelist network as a portfolio-company lead; no public developer
  portal, API, or specification is currently published by the company.
